
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Rahat Wallet</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101827;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px;
 background:#18263a;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{color:#e9c66b;font-size:22px;font-weight:bold}
.container{max-width:600px;margin:auto;padding:20px}
.balance{
 background:linear-gradient(135deg,#304c70,#172438);
 padding:25px;
 border-radius:18px;
 margin-top:20px;
}
.small{color:#b4c1d2;font-size:13px}
.amount{font-size:38px;margin:15px 0}
.actions{display:flex;gap:12px;margin-top:20px}
button{
 flex:1;padding:14px;border:0;
 border-radius:10px;
 background:#e9c66b;
 color:#101827;font-weight:bold;
}
h3{margin-top:30px}
.network{
 background:#202f43;
 padding:16px;
 margin:10px 0;
 border-radius:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
footer{text-align:center;color:#8999ad;padding:30px}
</style>
</head>

<body>
<header>
 <div class="logo">◈ RAHAT WALLET</div>
 <div>🔒</div>
</header>

<main class="container">
 <div class="small">YOUR CRYPTO WALLET</div>

 <section class="balance">
  <div class="small">TOTAL BALANCE</div>
  <div class="amount">$0.00</div>
  <div class="small">No wallet connected</div>
  <div class="actions">
   <button disabled>Receive</button>
   <button disabled>Send</button>
  </div>
 </section>

 <h3>Supported Networks</h3>
 <div id="networks"></div>

 <h3>Transactions</h3>
 <div class="network">
  <span>No transactions yet</span>
  <span>—</span>
 </div>
</main>

<footer>
 RA­HAT WALLET © 2026
 <p>Your Crypto. Your Keys. Your Control.</p>
</footer>

<script>
const coins=[
 ["🟡","BNB Smart Chain","BNB"],
 ["💎","Ethereum","ETH"],
 ["🔴","TRON","TRX"],
 ["🔵","TON","TON"],
 ["₿","Bitcoin","BTC"],
 ["🟣","Polygon","POL"],
 ["🟪","Solana","SOL"]
];

document.getElementById("networks").innerHTML=
coins.map(c=>`
 <div class="network">
  <strong>${c[0]} ${c[1]}</strong>
  <span class="small">${c[2]}</span>
 </div>
`).join("");
</script>
</body>
</html>
